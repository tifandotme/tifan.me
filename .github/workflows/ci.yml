name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "24"
          package-manager: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: vp check

      - name: Test
        run: vp test run

      - name: Build
        run: vp run build
        env:
          NEXT_PUBLIC_EMAIL: ci@example.invalid
          NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ci-placeholder
